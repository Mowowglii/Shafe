<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18231f" />
    <title>Shafe — Peer-to-peer file transfer</title>
  </head>
  <body>
    <div id="app-shell" class="app-shell app-shell--setup">
      <header class="app-header">
        <img class="app-logo" src="/logo-shafe.png" alt="" />
        <div>
          <h1>Shafe everything!</h1>
          <p>private, peer-to-peer file transfer</p>
        </div>
      </header>

      <main class="app-panel">
        <section id="setup-view" aria-labelledby="setup-title">
          <h2 id="setup-title">Start a transfer</h2>
          <button id="create-room-btn" type="button">Create a room</button>
          <p>or join with a room ID</p>
          <form id="join-room-form">
            <label for="room-id-input">Room ID</label>
            <input id="room-id-input" name="roomId" autocomplete="off" required />
            <button id="join-room-btn" type="submit">Join room</button>
          </form>
        </section>

        <section id="transfer-view" aria-labelledby="transfer-title" hidden>
          <h2 id="transfer-title">Transfer room</h2>
          <div class="transfer-layout">
            <div class="transfer-main">
              <div class="room-id-row">
                <p>Room ID: <code id="current-room-id"></code></p>
                <button id="copy-room-id-btn" type="button" aria-label="Copy room ID">Copy ID</button>
              </div>
              <p id="copy-room-id-status" role="status" aria-live="polite"></p>
              <p id="peer-disconnect-notice" role="alert" hidden></p>
              <label for="file-input">Choose one or more files</label>
              <input id="file-input" type="file" multiple />
              <button id="send-file-btn" type="button" disabled>Send file</button>
              <button id="leave-room-btn" type="button">Leave room</button>
              <ul id="transfer-list" class="transfer-list" aria-label="File transfers"></ul>
            </div>
            <aside class="connection-journal" aria-labelledby="connection-journal-title">
              <div class="connection-journal-header">
                <h3 id="connection-journal-title">Connection Events</h3>
                <button id="toggle-connection-events-btn" class="journal-toggle" type="button"
                  aria-expanded="true" aria-controls="connection-journal-content" aria-label="Hide connection events">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m6 9 6 6 6-6" />
                  </svg>
                </button>
              </div>
              <div id="connection-journal-content" class="connection-journal-content">
                <p id="connection-status" role="status" aria-live="polite">Connecting…</p>
                <ol id="connection-journal-list" class="connection-journal-list" aria-label="Connection history"></ol>
              </div>
            </aside>
          </div>
        </section>

        <p id="app-error" role="alert" hidden></p>
      </main>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>

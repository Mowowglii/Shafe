<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <title>Shafe — Peer-to-peer file transfer</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Shafe</h1>
        <p>Private, peer-to-peer file transfer</p>
      </header>

      <section id="setup-view" aria-labelledby="setup-title">
        <h2 id="setup-title">Start a transfer</h2>
        <button id="create-room-btn" type="button">Create a room</button>
        <p>or join with a room ID</p>
        <form id="join-room-form">
          <label for="room-id-input">Room ID</label>
          <input id="room-id-input" name="roomId" autocomplete="off" required />
          <button id="join-room-btn" type="submit">Join room</button>
        </form>
      </section>

      <section id="transfer-view" aria-labelledby="transfer-title" hidden>
        <h2 id="transfer-title">Transfer room</h2>
        <div class="room-id-row">
          <p>Room ID: <code id="current-room-id"></code></p>
          <button id="copy-room-id-btn" type="button" aria-label="Copy room ID">Copy ID</button>
        </div>
        <p id="copy-room-id-status" role="status" aria-live="polite"></p>
        <p id="connection-status" role="status" aria-live="polite">Connecting…</p>
        <p id="peer-disconnect-notice" role="alert" hidden></p>
        <label for="file-input">Choose a file</label>
        <input id="file-input" type="file" />
        <button id="send-file-btn" type="button" disabled>Send file</button>
        <button id="leave-room-btn" type="button">Leave room</button>
        <div class="transfer-progress">
          <progress id="progress-bar" value="0" max="100" aria-label="File transfer progress"></progress>
          <span id="transfer-complete" class="transfer-complete" role="status" aria-label="Transfer complete" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m5 12 4 4L19 6" />
            </svg>
          </span>
        </div>
        <ul id="received-files" aria-label="Received files"></ul>
      </section>

      <p id="app-error" role="alert" hidden></p>
    </main>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>

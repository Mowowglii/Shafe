spring.application.name=shafe

shafe.rooms.ttl=15m
shafe.rooms.warning-before-expiration=1m
shafe.rooms.cleanup-interval=1s

# Enable DEBUG/TRACE for Spring Web and WebSocket routing
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.socket=TRACE

# Enable DEBUG for Tomcat's internal WebSocket handling
logging.level.org.apache.tomcat.websocket=DEBUG

# Show your application's package logs
logging.level.com.nixxrazcorp.shafe=DEBUG
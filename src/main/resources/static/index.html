<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <title>Shafe</title>
    </head>

    <body>
        <h1>Shafe Everything</h1>

        <div id="setup-view" class="section">
            <h2>Start a Session</h2>
            <button id="create-room-btn">Create Transfer Room</button>

            <p>OR</p>

            <h2>Join a Session</h2>
            <input type="text" id="room-id-input" placeholder="Enter Room ID">
            <button id="join-room-btn">Join</button>
        </div>

        <div id="transfer-view" class="section hidden">
            <h2>Room: <span id="current-room-id"></span></h2>
            <p>Status: <span id="connection-status">Disconnected</span></p>

            <input type="file" id="file-input">
            <button id="send-file-btn" disabled>Send File</button>

            <h3>Progress</h3>
            <progress id="progress-bar" value="0" max="100"></progress>
        </div>

    </body>
</html>
